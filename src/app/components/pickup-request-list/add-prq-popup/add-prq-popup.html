<ng-template #Templatepod>
    <div class="custom-modal">
        <div style="background:#d0021b;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
            <span style="color:#fff;font-size:15px;font-weight:700">
                <i class="ti ti-plus-circle" style="margin-right:8px"></i>
                <span>Add Pickup Request (PRQ)</span>
            </span>
            <button type="button" class="btn-close" style="color:rgba(255,255,255,0.8);cursor:pointer;font-size:18px"  (click)="onClose()">
            </button>
        </div>

        <form [formGroup]="prqForm" (ngSubmit)="onSubmit()" class="modal-form">
            <div class="scrollable-content">

                <!-- Soft-Outline Chip / Tag Selection (Stacked Vertically / Upar-Niche) -->
                <!-- Eway Bill Tag Selector (Top Row) -->
                <div style="margin-bottom: 16px;">
                    <label style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px">
                        Eway Bill <span style="color:#D0021B">*</span>
                    </label>
                    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
                        <label class="tag-radio-chip" [class.selected]="prqForm.get('ewayBill')?.value === 'with'">
                            <input type="radio" formControlName="ewayBill" value="with" class="hidden-radio">
                            <span class="tag-circle"></span>
                            <span class="tag-label">With Eway Bill</span>
                        </label>

                        <label class="tag-radio-chip" [class.selected]="prqForm.get('ewayBill')?.value === 'without'">
                            <input type="radio" formControlName="ewayBill" value="without" class="hidden-radio">
                            <span class="tag-circle"></span>
                            <span class="tag-label">Without Eway Bill</span>
                        </label>
                    </div>
                </div>

                <!-- Service Type Tag Selector (Bottom Row) -->
                <div style="margin-bottom: 18px;">
                    <label style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px">
                        Service Type <span style="color:#D0021B">*</span>
                    </label>
                    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
                        <label class="tag-radio-chip" [class.selected]="prqForm.get('service_Type')?.value === 'LTL'">
                            <input type="radio" formControlName="service_Type" value="LTL" class="hidden-radio">
                            <span class="tag-circle"></span>
                            <span class="tag-label">LTL</span>
                        </label>

                        <label class="tag-radio-chip" [class.selected]="prqForm.get('service_Type')?.value === 'FTL'">
                            <input type="radio" formControlName="service_Type" value="FTL" class="hidden-radio">
                            <span class="tag-circle"></span>
                            <span class="tag-label">FTL</span>
                        </label>
                    </div>
                </div>

                <div *ngIf="prqForm.get('ewayBill')?.value && prqForm.get('service_Type')?.value">
                    <div id="add-main-fields">
                    <hr style="border:none;border-top:1px solid var(--border);margin-bottom:16px">

                    <!-- Common -->
                    <div class="form-row">
                        <div>
                            <label
                                style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Group
                                Code</label>
                            <input type="text" formControlName="groupCode" readonly
                                style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;background:#f8fafc;font-size:13px;cursor:not-allowed;color:#374151">
                        </div>
                        <div>
                            <label
                                style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Customer
                                Name <span style="color:#D0021B">*</span></label>
                            <ng-select [items]="customerData" bindLabel="text" bindValue="id"
                                formControlName="customerCode" placeholder="-- Select Customer --"
                                [typeahead]="customerSearchSubject" 
                                [loading]="isCustomerLoading" [notFoundText]="customerNotFoundText">
                            </ng-select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div>
                            <label
                                style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">PRQ
                                Date</label>
                            <input type="text" formControlName="prqDate" readonly
                                style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;background:#f8fafc;font-size:13px;cursor:not-allowed"
                                bsDatepicker>
                        </div>
                        <div></div>
                    </div>

                    <div class="form-row">
                        <div>
                            <label
                                style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">No.
                                of Pkgs <span style="color:#D0021B">*</span></label>
                            <input type="text" formControlName="pkgs" oninput="this.value = this.value.replace(/[^0-9.]/g,'');" placeholder="Enter Pkgs"
                                style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none">
                        </div>
                        <div>
                            <label
                                style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Weight
                                (KG) <span style="color:#D0021B">*</span></label>
                            <input type="text" formControlName="weight" oninput="this.value = this.value.replace(/[^0-9.]/g,'');"
                                placeholder="Enter weight"
                                style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none">
                        </div>
                    </div>
                
                    <div class="form-row">
                        <div>
                            <label
                                style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Transport
                                Mode <span style="color:#D0021B">*</span></label>
                            <ng-select [items]="transportModes" bindLabel="name" bindValue="value"
                                formControlName="transportMode" placeholder="Select Transport Mode" [searchable]="true"
                                [clearable]="true" class="custom-ng-select">
                            </ng-select>
                        </div>
                        <div>
                            <div *ngIf="prqForm.get('service_Type')?.value === 'FTL'">
                                <label
                                    style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">FTL
                                    Type *</label>
                                <ng-select [items]="fleetTypeData" bindLabel="codeDesc" bindValue="codeId"
                            formControlName="ftlType" placeholder="Select Transport Mode" [searchable]="true"
                            [clearable]="true" 
                            class="custom-ng-select" 
                           >
                        </ng-select>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div>
                            <label
                                style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Pickup
                                Pin Code <span style="color:#D0021B">*</span></label>
                            <ng-select [items]="pincodeData" bindLabel="text" bindValue="id"
                                formControlName="pinCode" placeholder="Enter 6-digit pincode"
                                [typeahead]="pincodeSearchSubject" (change)="onChangePincode($event?.id)"
                                [loading]="isPincodeLoading" [notFoundText]="pincodeNotFoundText">
                            </ng-select>
                            <div style="font-size:11px;color:var(--text-muted);margin-top:3px">From City auto-fills from
                                Pincode master</div>
                        </div>
                        <div>
                            <label
                                style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">From
                                City <span style="color:#D0021B">*</span></label>
                            <input type="text" formControlName="fromCity" readonly
                                placeholder="Auto-filled from pincode"
                                style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none;background:#f8fafc;cursor:not-allowed">
                        </div>
                    </div>

                    <div class="form-row">
                        <div>
                            <label
                                style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Delivery
                                Pincode <span style="color:#D0021B">*</span></label>
                            <ng-select [items]="destPincodeData" bindLabel="text" bindValue="id"
                                formControlName="desPincode" placeholder="Type pincode or city name..."
                                [typeahead]="destPincodeSearchSubject" (change)="onChangeDestPincode($event?.id)"
                                [loading]="isDestPincodeLoading" [notFoundText]="destPincodeNotFoundText">
                            </ng-select>
                            <div style="font-size:11px;color:var(--text-muted);margin-top:3px">To City auto-fills from
                                Pincode master</div>
                        </div>
                        <div>
                            <label
                                style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">To
                                City <span style="color:#D0021B">*</span></label>
                            <input type="text" formControlName="desBranchCode" readonly
                                placeholder="Auto-filled from Delivery Pincode"
                                style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none;background:#f8fafc;cursor:not-allowed">
                        </div>
                    </div>

                    <!-- Cold chain (shown if FTL + Cold Chain mode) -->
                    <div
                        *ngIf="prqForm.get('transportMode')?.value === 'Cold Chain' && prqForm.get('service_Type')?.value === 'FTL'">
                        <div class="form-row">
                            <div>
                                <label style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">
                                    Cold Chain Category</label>
                                <ng-select [items]="coldChainCategories" bindLabel="name" bindValue="value"
                                    formControlName="coldChainCategory" placeholder="Select Category" [searchable]="true"
                                    [clearable]="true" class="custom-ng-select" (change)="onColdChainCategoryChange($event)">
                                </ng-select>
                            </div>
                            <div>
                                <label
                                    style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Temp
                                    Range</label>
                                <input type="text" formControlName="tempRange" readonly
                                    placeholder="Auto-filled on category selection"
                                    style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;background:#f8fafc;font-size:13px;cursor:not-allowed">
                            </div>
                        </div>
                    </div>

                    <hr style="border:none;border-top:1px solid var(--border);margin:14px 0">

                    <!-- Eway Bill Details -->
                    <div
                        style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid var(--scorpion-red);display:inline-block">
                        Eway Bill Details</div>

                    <!-- Eway-specific fields -->
                    <div *ngIf="prqForm.get('ewayBill')?.value === 'with'" style="margin-top:10px">
                        <div class="form-row">
                            <div>
                                <label
                                    style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Eway
                                    Bill No. <span style="color:#D0021B">*</span></label>
                                <input type="text" formControlName="ewayBillNo" placeholder="Enter eway bill no." (input)="getEwayBillData($event)"
                                    style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none">
                            </div>
                            <div>
                                <label
                                    style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Eway
                                    Bill Date <span style="color:#D0021B">*</span></label>
                                <input type="text" formControlName="ewayBillDate" readonly
                                    placeholder="Auto-filled from Eway Bill No."
                                    style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none;background:#f8fafc;cursor:not-allowed">
                            </div>
                        </div>
                        <div class="form-row">
                            <div>
                                <label
                                    style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Eway
                                    Exp. Date <span style="color:#D0021B">*</span></label>
                                <input type="text" formControlName="ewayExpDate" readonly
                                    placeholder="Auto-filled from Eway Bill No."
                                    style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none;background:#f8fafc;cursor:not-allowed">
                            </div>
                            <div></div>
                        </div>
                    </div>

                    <!-- Invoice fields -->
                    <div class="form-row" style="margin-top:6px">
                        <div>
                            <label
                                style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Invoice
                                No. <span style="color:#D0021B">*</span></label>
                            <input type="text" formControlName="invoiceNo" placeholder="Auto-filled from Eway Bill"
                                style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none;background:#f8fafc;cursor:not-allowed"
                                [readonly]="prqForm.get('ewayBill')?.value === 'with'">
                        </div>
                        <div>
                            <label
                                style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Invoice
                                Date <span style="color:#D0021B">*</span></label>
                            <input type="text" formControlName="invoiceDate" placeholder="Auto-filled from Eway Bill"
                                style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none;background:#f8fafc;cursor:not-allowed"
                                [readonly]="prqForm.get('ewayBill')?.value === 'with'">
                        </div>
                    </div>
                    <div class="form-row">
                        <div>
                            <label
                                style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Invoice
                                Value (&#8377;) <span style="color:#D0021B">*</span></label>
                            <input type="text" formControlName="invoiceValue" placeholder="Auto-filled from Eway Bill"
                                style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none;background:#f8fafc;cursor:not-allowed"
                                [readonly]="prqForm.get('ewayBill')?.value === 'with'">
                        </div>
                        <div></div>
                    </div>

                    <hr style="border:none;border-top:1px solid var(--border);margin:14px 0">

                    <!-- Consignor/Consignee -->
                    <div>
                        <div
                            style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid var(--scorpion-red);display:inline-block">
                            Consignor / Consignee Details</div>

                        <div *ngIf="prqForm.get('ewayBill')?.value === 'with'"
                            style="font-size:11.5px;color:#666;background:#fff8e1;border:1px solid #ffe082;border-radius:6px;padding:6px 10px;margin-bottom:10px">
                            <i class="ti ti-info-circle"
                                style="vertical-align:-2px;margin-right:4px;color:#f59e0b"></i>Fields are auto-filled
                            from Eway Bill master and are read-only.
                        </div>

                        <div class="form-row" style="margin-top:10px">
                            <div>
                                <label
                                    style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Consignor
                                    Name</label>
                                <input type="text" formControlName="consignorName" placeholder="Consignor name"
                                    style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none"
                                    [readonly]="prqForm.get('ewayBill')?.value === 'with'">
                            </div>
                            <div>
                                <label
                                    style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Consignee
                                    Name</label>
                                <input type="text" formControlName="consigneeName" placeholder="Consignee name"
                                    style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none"
                                    [readonly]="prqForm.get('ewayBill')?.value === 'with'">
                            </div>
                        </div>
                        <div class="form-row">
                            <div>
                                <label
                                    style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Consignor
                                    Address</label>
                                <input type="text" formControlName="consignorAddress" placeholder="Address"
                                    style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none"
                                    [readonly]="prqForm.get('ewayBill')?.value === 'with'">
                            </div>
                            <div>
                                <label
                                    style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Consignee
                                    Address</label>
                                <input type="text" formControlName="consigneeAddress" placeholder="Address"
                                    style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none"
                                    [readonly]="prqForm.get('ewayBill')?.value === 'with'">
                            </div>
                        </div>
                        <div class="form-row">
                            <div>
                                <label
                                    style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Consignor
                                    Pincode</label>
                                <input type="text" formControlName="consignorPin" placeholder="6-digit pincode"
                                    maxlength="6"
                                    style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none"
                                    [readonly]="prqForm.get('ewayBill')?.value === 'with'">
                            </div>
                            <div>
                                <label
                                    style="font-size:11px;font-weight:700;color:var(--text-muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Consignee
                                    Pincode</label>
                                <input type="text" formControlName="consigneePin" placeholder="6-digit pincode"
                                    maxlength="6"
                                    style="width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;outline:none"
                                    [readonly]="prqForm.get('ewayBill')?.value === 'with'">
                            </div>
                        </div>
                    </div>
                </div>
                </div>

                <ng-template #pleaseSelect>
                    <div style="padding: 40px; text-align: center; color: var(--text-muted, #6b7280); font-size: 14px; margin-top: 20px;">
                        <i class="ti ti-info-circle" style="font-size: 28px; color: #d1d5db; margin-bottom: 12px; display: block;"></i>
                        Please select Eway Bill and Service Type options above to proceed.
                    </div>
                </ng-template>
            </div>

            <!-- Fixed Footer Buttons (Always visible at bottom without scrolling) -->
            <div class="fixed-modal-footer">
                <button type="button" class="btn-secondary" (click)="onClose()">Cancel</button>
                <button type="submit" class="btn-primary" [disabled]="prqForm.invalid"><i class="ti ti-send"
                        style="margin-right:5px"></i>Submit PRQ</button>
            </div>
        </form>
    </div>
</ng-template>
