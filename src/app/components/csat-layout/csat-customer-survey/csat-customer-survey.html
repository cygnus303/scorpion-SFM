<!-- ── TAB: CUSTOMER SURVEY ── -->
<div id="csat-panel-survey">
    <div style="max-width:580px;margin:0 auto">
        <div
            style="background:var(--dark);border-radius:12px 12px 0 0;padding:20px 24px;display:flex;align-items:center;gap:12px">
            <div
                style="width:40px;height:40px;background:var(--red);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;flex-shrink:0">
                S</div>
            <div>
                <div style="font-size:15px;font-weight:600;color:#fff">Customer Satisfaction Survey</div>
                <div style="font-size:11px;color:rgba(255,255,255,.45);margin-top:1px">Scorpion Express Pvt Ltd · Takes
                    ~2 minutes</div>
            </div>
            <div style="margin-left:auto;text-align:right">
                <div id="sv2-account" style="font-size:12px;font-weight:600;color:rgba(255,255,255,.65)">
                    <!-- {{ customerDetails ? customerDetails.ContactName : 'Post-Delivery Survey' }} -->
                </div>
            </div>
        </div>

        <div id="sv2-form"
            style="background:var(--white);border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;padding:24px">
            <!-- Progress -->
            <div style="margin-bottom:18px">
                <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span
                        style="font-size:11px;color:var(--text3)">Survey progress</span><span id="sv2-prog-txt"
                        style="font-size:11px;font-weight:600;color:var(--red)">0 of {{ surveyQuestions.length }} answered</span></div>
                <div style="height:5px;background:var(--bg);border-radius:3px;overflow:hidden">
                    <div id="sv2-prog-bar"
                        style="height:100%;background:var(--red);border-radius:3px;width:0%;transition:width .4s"></div>
                </div>
            </div>

            <!-- Dynamic Questions -->
            <div *ngFor="let q of surveyQuestions; let i = index"
                style="margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border)">
                <div style="font-size:13px;font-weight:600;color:var(--text1);margin-bottom:10px">{{ i + 1 }}. {{
                    q.codeDesc }}</div>
                <div style="display:flex;gap:6px">
                    <button class="rtn" (click)="rate(q.codeId, 1, $event.currentTarget!)"
                        style="flex:1;padding:10px 4px;border-radius:7px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s;font-size:14px">
                        <span>⭐</span>
                        <span style="font-size:9px;font-weight:600;color:var(--text3)">Very Poor</span>
                    </button>
                    <button class="rtn" (click)="rate(q.codeId, 2, $event.currentTarget!)"
                        style="flex:1;padding:10px 4px;border-radius:7px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s;font-size:14px">
                        <span>⭐⭐</span>
                        <span style="font-size:9px;font-weight:600;color:var(--text3)">Poor</span>
                    </button>
                    <button class="rtn" (click)="rate(q.codeId, 3, $event.currentTarget!)"
                        style="flex:1;padding:10px 4px;border-radius:7px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s;font-size:14px">
                        <span>⭐⭐⭐</span>
                        <span style="font-size:9px;font-weight:600;color:var(--text3)">Average</span>
                    </button>
                    <button class="rtn" (click)="rate(q.codeId, 4, $event.currentTarget!)"
                        style="flex:1;padding:10px 4px;border-radius:7px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s;font-size:14px">
                        <span>⭐⭐⭐⭐</span>
                        <span style="font-size:9px;font-weight:600;color:var(--text3)">Good</span>
                    </button>
                    <button class="rtn" (click)="rate(q.codeId, 5, $event.currentTarget!)"
                        style="flex:1;padding:10px 4px;border-radius:7px;border:1.5px solid var(--border);background:var(--white);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s;font-size:14px">
                        <span>⭐⭐⭐⭐⭐</span>
                        <span style="font-size:9px;font-weight:600;color:var(--text3)">Excellent</span>
                    </button>
                </div>
            </div>


             <!-- Comments -->
            <div style="margin-bottom:18px">
                <div style="font-size:13px;font-weight:600;color:var(--text1);margin-bottom:8px">{{ surveyQuestions.length + 1 }}. Any comments or
                    suggestions? <span style="font-size:11px;color:var(--text3);font-weight:400">(Optional)</span></div>
                <textarea id="sv2-comments" [(ngModel)]="anySuggestions" placeholder="Share your thoughts, suggestions, or specific incidents..."
                    style="min-height:72px"></textarea>
            </div>

            <button class="btn btn-red" style="width:100%;justify-content:center;padding:12px;font-size:14px"
                (click)="csatSubmit()">Submit My Feedback →</button>
            <div style="text-align:center;font-size:11px;color:var(--text3);margin-top:8px">Your response is
                confidential and stored securely.</div>
        </div>

        <!-- Thank you -->

    </div>
</div>
