<!-- ══ CALENDAR ══ -->
<div class="page active">
  <div class="g3">
    <div class="card s2">
      <div class="portlet-body p-3">
        <full-calendar #calendar *ngIf="isBrowser" [options]="calendarOptions"></full-calendar>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="card">
        <div class="card-head">
          <div class="ci g">📋</div>
          <div class="card-title">Today's Events — {{ currentFormattedDate }}</div>
        </div>
        <div class="tl">
          <div class="tl-item" *ngFor="let event of todayEvents">
            <div class="tl-dot green">✓</div>
            <div class="tl-content">
              <div class="tl-title">{{ getEventTime(event.start) }} — {{ event.title }}</div>
              <div class="tl-meta">{{ event.description || 'Calendar Event' }}</div>
            </div>
          </div>
          <div class="no-events" *ngIf="todayEvents.length === 0"
            style="padding: 10px; color: var(--text-muted); font-size: 12px; text-align: center;">
            No events for today
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-head">
          <div class="ci">📅</div>
          <div class="card-title">Upcoming — This Week</div>
        </div>
        <div class="tl">
          <div class="tl-item" *ngFor="let event of upcomingEvents"
            (click)="editMeetingModal(event.meetingId || event.callId)">
            <div class="tl-dot amber">!</div>
            <div class="tl-content">
              <div class="tl-title">{{ getEventDate(event.start) }} — {{ event.title }}</div>
              <div class="tl-meta">{{ event?.rightText }}</div>
            </div>
          </div>
          <div class="no-events" *ngIf="upcomingEvents.length === 0"
            style="padding: 10px; color: var(--text-muted); font-size: 12px; text-align: center;">
            No upcoming events
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<app-add-meeting (dataEmitter)="closeEditMeetingModal()" [meetingResponse]="selectedMeeting"
  [isMeetingList]="'Update'"></app-add-meeting>
