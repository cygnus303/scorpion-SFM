<ng-template #approvalTemplate>
  <div class="modal-content custom-modal" style="border: none;">
    <div class="modal-header">
      <h2 class="modal-title">Send For Approval — <span>{{ prospectName }}</span></h2>
      <button class="close-btn" (click)="closePopup()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 1L1 13M1 1L13 13" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="upload-section">
        <label class="upload-label">Physical Signed Copy Upload <span class="req">*</span></label>
        
        <input type="file" #fileInput (change)="onFileSelected($event)" style="display: none" accept=".pdf,.jpg,.png,.jpeg">
        
        <div class="upload-area" [class.error]="isSubmitted && !selectedFile" (click)="fileInput.click()">
          <div class="upload-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M21.44 11.05L12.25 20.24C11.1242 21.3658 9.59727 21.9983 8.005 21.9983C6.41273 21.9983 4.88582 21.3658 3.76 20.24C2.63418 19.1142 2.00166 17.5873 2.00166 15.995C2.00166 14.4027 2.63418 12.8758 3.76 11.75L12.95 2.56C13.7005 1.80946 14.7184 1.3878 15.78 1.3878C16.8416 1.3878 17.8595 1.80946 18.61 2.56C19.3605 3.31054 19.7822 4.32845 19.7822 5.39C19.7822 6.45155 19.3605 7.46946 18.61 8.22L9.42 17.41C9.04473 17.7853 8.53582 17.9961 8.005 17.9961C7.47418 17.9961 6.96527 17.7853 6.59 17.41C6.21473 17.0347 6.0039 16.5258 6.0039 15.995C6.0039 15.4642 6.21473 14.9553 6.59 14.58L15.07 6.1" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="upload-text" *ngIf="!selectedFile">Click to browse the physical signed copy</div>
          <div class="upload-text text-success" *ngIf="selectedFile" style="color: #10B981; font-weight: 600;">{{ selectedFile.name }}</div>
          <div class="upload-hint" *ngIf="!selectedFile">PDF, JPG or PNG</div>
        </div>
        
        <div class="mandatory-text" *ngIf="isSubmitted && !selectedFile">Physical signed copy is mandatory</div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="closePopup()">
        Cancel
      </button>
      <button class="btn-submit" (click)="onSubmit()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 6px;">
          <path d="M5.5 11.0858L2.20711 7.79289L0.792893 9.20711L5.5 13.9142L15.2071 4.20711L13.7929 2.79289L5.5 11.0858Z" fill="white"/>
        </svg>
        Submit
      </button>
    </div>
  </div>
</ng-template>
